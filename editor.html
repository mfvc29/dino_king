<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Rey · Editor de mapas</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0a0a0c; color: #f5f5f0; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 16px; }
        a { color: #ffd60a; }
    </style>
</head>
<body>
    <!--
        El editor antiguo (formato de mapa v1) se reemplazó por el editor de tools/map_editor,
        que entiende las capas, personajes y puertas de los mapas actuales. Esta página solo redirige.
        El editor antiguo sigue en el historial de git (commit 47dfb2b) si lo necesitas.
    -->
    <div>
        <h1>🛠️ Editor de mapas</h1>
        <p id="msg">Abriendo el editor de mapas...</p>
    </div>
    <script>
        const host = location.hostname;
        const local = host === 'localhost' || host === '127.0.0.1' || /^192\.168\.|^10\./.test(host);
        const msg = document.getElementById('msg');
        const url = local ? `http://${host}:8080/` : '/tools/map_editor/';
        msg.innerHTML = `Si no se abre solo, entra a <a href="${url}">${url}</a>.`;
        location.replace(url);
    </script>
</body>
</html>
