# Blueprint de Render: el juego Dino Rey (portada, isla 3D y Dino Lector).
services:
  - type: web
    name: dino-king-multijugador
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JUEGO_PUBLICO
        value: "1"
